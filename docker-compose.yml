services:
  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    container_name: earthquake-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: earthquake-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      - minio
    entrypoint: ["/usr/bin/mc"]
    command:
      - mb
      - --ignore-existing
      - --insecure
      - local/earthquake-data
    environment:
      MC_HOST_local: http://${MINIO_ACCESS_KEY:-minioadmin}:${MINIO_SECRET_KEY:-minioadmin}@minio:9000

  ingestion:
    build: .
    container_name: earthquake-ingestion
    command: ["python", "-m", "earthquake_platform.ingestion"]
    environment:
      USGS_FEED_URL: ${USGS_FEED_URL:-https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: earthquakes
      INGESTION_CHECKPOINT_DB: /app/data/seen_events.sqlite3
    volumes:
      - ingestion_state:/app/data
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  spark-processor:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: earthquake-spark
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: earthquakes
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-earthquake-data}
      MAX_TIME_DAYS: 7
      MAX_DISTANCE_KM: 100
      MINIMUM_CLUSTER_EVENTS: 2
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  minio_data:
  ingestion_state:
